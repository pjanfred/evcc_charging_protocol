# English strings (source of truth). Every key used by the app must exist
# here; de.yaml only needs to override the keys it translates.

app:
  title: "Charging Cost Report"
  subtitle: "Proof of evcc charging sessions (incl. meter readings) for employer reimbursement"
  footer: "evcc Charging Cost Report · Home Assistant Add-on"

form:
  new_report:
    title: "Create new report"
    month: "Month"
    year: "Year"
    method: "Method"
    method_flat: "Flat rate"
    method_actual: "Actual cost"
    employee: "Employee"
    employee_placeholder: "Name shown in the report header"
    vehicle: "Vehicle"
    vehicle_placeholder: "e.g. Seat, WI-XX 1234"
    include_chart: "Include chart in the PDF"
    hint: "evcc instance: <code>{url}</code> · Vehicle filter: <code>{vehicles}</code><br>Please make changes via the add-on configuration."
    submit: "Create PDF report"

  tariffs:
    title: "Tariff history (for \"Actual cost\")"
    hint: "Periods entered here apply from their start date until the next entry takes over, so a tariff change mid-month is applied correctly per charging session. You can optionally upload a receipt (PDF, e.g. energy contract or price adjustment letter) per period – it is then automatically attached to every affected report."
    valid_from: "Valid from"
    price: "Price (€/kWh)"
    price_placeholder: "e.g. 0.2614"
    document: "Receipt"
    document_optional: "Receipt (PDF, optional)"
    no_document: "– no receipt –"
    remove: "Remove"
    delete: "Delete"
    empty: "No tariff periods added yet."
    confirm_delete_doc: "Really remove the receipt for the tariff starting {date}?"
    confirm_delete: "Really delete the tariff entry starting {date}?"
    add: "Add"

  reports:
    title: "Existing reports"
    file: "File"
    created: "Created"
    size: "Size"
    submitted: "Submitted"
    download: "Download"
    delete: "Delete"
    empty: "No reports created yet."
    confirm_delete: "Really delete report {name}?"

