name: "evcc Charging Cost Report"
version: "1.7.1"
slug: "evcc_ladekosten"
description: "Generates PDF proof of evcc charging sessions (incl. meter readings) for reimbursement of company car charging costs"
url: "https://github.com/pjanfred/evcc_charging_protocol"
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:ev-station
panel_title: "Charging Costs"
homeassistant_api: true
map:
  - share:rw
options:
  evcc_url: "http://homeassistant.local:7070"
  vehicles: []
  method: "pauschale"
  rate_ct_per_kwh: 0.0
  employee: ""
  vehicle: ""
  language: "en"
  auto_generate: true
  notify_on_generate: true
  footnote_pauschale: ""
  footnote_actual: "Basis of calculation: individual household tariff."
  include_chart: false
schema:
  evcc_url: "url"
  vehicles:
    - "str"
  method: "list(pauschale|actual)"
  rate_ct_per_kwh: "float"
  employee: "str?"
  vehicle: "str?"
  language: "list(en|de)"
  auto_generate: "bool"
  notify_on_generate: "bool"
  footnote_pauschale: "str?"
  footnote_actual: "str?"
  include_chart: "bool"
